
#:schema https://www.schemastore.org/prek.json

exclude = '^(target|node_modules)/'

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files", args = [
        "--maxkb=1024",
    ] },
    { id = "mixed-line-ending", args = [
        "--fix=lf",
    ] },
]

# ========== Python：Ruff 一体化（格式化 + 语法/Lint） ==========
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"
hooks = [{ id = "ruff", args = ["--fix"] }, { id = "ruff-format" }]

# ========== JSON：语法检查 + 格式化 ==========
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-json" }, # 语法检查
    { id = "pretty-format-json", args = [
        "--autofix",
        "--indent=2",
        "--no-sort-keys",
    ] }
]

# ========== Rust：cargo fmt + cargo clippy ==========
[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt",name = "cargo fmt", language = "system", entry = "cargo fmt --all --", types = [
        "rust",
    ], pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", language = "system", entry = "cargo clippy --all-targets --all-features -- -D warnings", types = [
        "rust",
    ], pass_filenames = false },
]
