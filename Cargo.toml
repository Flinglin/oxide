[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0
debug = 1
incremental = true
split-debuginfo = "unpacked"

# The refreshed GPUI traverses larger interaction and layout trees. Keep the default development
# build debuggable while avoiding multi-hundred-millisecond frames in the native GUI.
[profile.dev.package.oxide-app]
opt-level = 1

[profile.dev.package.gpui-pre]
opt-level = 1

[profile.dev.package.taffy]
opt-level = 1

# Background previews resize decoded frames continuously, including in development builds.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.fast_image_resize]
opt-level = 2

[profile.dev.package.oxide-background-media]
opt-level = 2
